app = "crucible-demo"
primary_region = "yul"

[build]
  dockerfile = "Dockerfile"

[env]
  WORKERS = "2"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024
